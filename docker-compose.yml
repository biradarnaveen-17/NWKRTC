services:
  web:
    build: .
    container_name: nwkrtc-leave-assistant
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_PATH: /app/data/nwkrtc_jobs.sqlite3
      TZ: Asia/Kolkata
    ports:
      # Local host only: add HTTPS and authentication before any public access.
      - "127.0.0.1:8000:8000"
    volumes:
      - nwkrtc_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nwkrtc_data:
